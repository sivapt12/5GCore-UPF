apiVersion: v1
kind: ConfigMap
metadata:
  name: upf-app-id-filters
data:
  00-http-health.tsv: |
    # Local source: core-upg-vpp/config/app-id.d/00-http-health.tsv
    # UPG-VPP matches these expressions against http://host/path.
    app	http-health	proxy
    l7	http-health	1000	^https?://health\.example/healthz
  10-api.tsv: |
    l7	http-health	2000	^https?://api\.example/v1/
